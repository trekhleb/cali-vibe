    <noscript>
      <h1>CaliVibe — Interactive California Map</h1>
      <p>Explore California neighborhoods on a single interactive map: housing costs, crime rates, population, temperature, sunshine hours, transit routes, and 3D terrain — all by county and city.</p>
      <h2>What you can explore</h2>
      <ul>
        <li><strong>Housing Cost</strong> — Median home value and median gross rent for all 58 California counties (Census ACS 2019–2023)</li>
        <li><strong>Crime Rates</strong> — 10 crime categories per 100,000 residents for counties and cities (CA DOJ 2023)</li>
        <li><strong>Population</strong> — 2024 county population estimates (CA Dept. of Finance)</li>
        <li><strong>Temperature</strong> — Monthly average highs, lows, and means on an H3 hex grid (2014–2023 normals)</li>
        <li><strong>Sunshine Hours</strong> — Average daily sunshine hours by month, satellite-derived (NREL NSRDB)</li>
        <li><strong>Transit</strong> — 18 California rail systems: BART, Caltrain, LA Metro, Muni Metro, VTA, SMART, Metrolink, San Diego Trolley, Coaster, Sprinter, Sacramento RT, ACE, Capitol Corridor, Pacific Surfliner, San Joaquins, Coast Starlight, California Zephyr, Southwest Chief</li>
        <li><strong>3D Terrain</strong> — Raised-relief view with labeled mountain peaks</li>
        <li><strong>County &amp; City Boundaries</strong> — 58 counties and 482 incorporated cities</li>
      </ul>
      <p>This application requires JavaScript to run. Please enable JavaScript in your browser.</p>
    </noscript>
