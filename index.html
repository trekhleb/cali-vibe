    <noscript>
      <h1>CaliVibe — Interactive California Map</h1>
      <p>Explore California on a single interactive map: compare counties and cities side by side across housing costs, household income, educational attainment, race/ethnicity breakdown, age distribution, poverty rates, crime rates, population, density, temperature, sunshine hours, transit routes, and 3D terrain.</p>
      <h2>What you can explore</h2>
      <ul>
        <li><strong>Compare</strong> — Compare any California counties or cities side by side across all metrics including population, crime, housing, income, education, race/ethnicity, age distribution, and poverty with color-coded rankings</li>
        <li><strong>Housing Cost</strong> — Median home value and median gross rent for all 58 California counties and 697 cities/CDPs (Census ACS 2019–2023)</li>
        <li><strong>Household Income</strong> — Median household income for all 58 California counties and 697 cities/CDPs (Census ACS 2019–2023)</li>
        <li><strong>Educational Attainment</strong> — Bachelor's degree+, high school diploma+, and graduate degree+ rates for all 58 counties and 697 cities/CDPs (Census ACS 2019–2023, Table B15003)</li>
        <li><strong>Race/Ethnicity Breakdown</strong> — White, Hispanic/Latino, Black, Asian, and Other race/ethnicity percentages for all 58 counties and 697 cities/CDPs (Census ACS 2019–2023, Table B03002)</li>
        <li><strong>Age Distribution</strong> — Under 18, 18–34, 35–64, 65+, and median age for all 58 counties and 697 cities/CDPs (Census ACS 2019–2023, Tables B01001 &amp; B01002)</li>
        <li><strong>Poverty Rate</strong> — Percentage of population below the poverty level for all 58 counties and 697 cities/CDPs (Census ACS 2019–2023, Table B17001)</li>
        <li><strong>Crime Rates</strong> — 10 crime categories per 100,000 residents for counties and cities (CA DOJ 2023)</li>
        <li><strong>Population &amp; Density</strong> — 2024 county and city population estimates with population density per square mile (CA Dept. of Finance)</li>
        <li><strong>Temperature</strong> — Monthly average highs, lows, and means on an H3 hex grid (2014–2023 normals)</li>
        <li><strong>Sunshine Hours</strong> — Average daily sunshine hours by month, satellite-derived (NREL NSRDB)</li>
        <li><strong>Transit</strong> — 18 California rail systems: BART, Caltrain, LA Metro, Muni Metro, VTA, SMART, Metrolink, San Diego Trolley, Coaster, Sprinter, Sacramento RT, ACE, Capitol Corridor, Pacific Surfliner, San Joaquins, Coast Starlight, California Zephyr, Southwest Chief</li>
        <li><strong>3D Terrain</strong> — Raised-relief view with labeled mountain peaks</li>
        <li><strong>County &amp; City Boundaries</strong> — 58 counties and 697 places (482 cities + 215 CDPs)</li>
      </ul>
      <p>This application requires JavaScript to run. Please enable JavaScript in your browser.</p>
